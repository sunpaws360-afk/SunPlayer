name: Android Build & Release

# Defense-in-depth: every job defaults to read-only token access.
# Only the publish job elevates to contents:write (needed to create a release).
#
# Release flow (fully automated): bump versionCode/versionName in
# app/build.gradle.kts, add docs/releases/<version>.md, merge to main, then
#   git tag v<version> && git push origin v<version>
# The tag push runs verify + secret-scan + release-candidate (signed APK/AAB +
# SHA256SUMS) + publish (GitHub Release). The 'release' environment gate can
# require manual approval before signing secrets are exposed.
permissions:
  contents: read

concurrency:
  group: sunplayer-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags:
      - 'v*'   # pushing a version tag (e.g. v1.3.0.2) starts the release pipeline
  workflow_dispatch:  # manual run: verify only (no release jobs)

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history so scans cover past commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

  release-candidate:
    name: Release candidate
    outputs:
      version: ${{ steps.tag.outputs.version }}
    needs: [verify, secret-scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive tag and validate it matches the app version
        id: tag
        run: |
          version_name=$(grep -E 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${GITHUB_REF_NAME}"
          expected_tag="v${version_name}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "::error::Pushed tag $tag does not match versionName $version_name. Expected $expected_tag."
            exit 1
          fi
          echo "version=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        id: signing
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          missing=0
          for value in \
            "$SUNPLAYER_KEYSTORE_BASE64" \
            "$SUNPLAYER_KEYSTORE_PASSWORD" \
            "$SUNPLAYER_KEY_ALIAS" \
            "$SUNPLAYER_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::All release-signing secrets must be defined in the GitHub release environment before a release candidate can be built."
            exit 1
          fi

          echo "$SUNPLAYER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunplayer-release.keystore"
          echo "keystore_path=$RUNNER_TEMP/sunplayer-release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release artifacts
        env:
          SUNPLAYER_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Remove decoded keystore from the runner immediately after signing
        if: always()
        run: rm -f "$RUNNER_TEMP/sunplayer-release.keystore"
      - name: Generate SHA-256 checksums for sideload verification
        run: |
          cd app/build/outputs
          sha256sum apk/release/app-release.apk bundle/release/app-release.aab > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release-candidate, secret-scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: release-artifacts

      - name: Resolve changelog for this version
        env:
          VERSION: ${{ needs.release-candidate.outputs.version }}
        run: |
          file="docs/releases/${VERSION}.md"
          if [ ! -f "$file" ]; then
            echo "::error::Missing changelog $file - add it on main before pushing the tag."
            exit 1
          fi
          cp "$file" release-notes.md

      - name: Create GitHub release with artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "SunPlayer $TAG" \
            --notes-file release-notes.md \
            --latest \
            release-artifacts/app-release.apk \
            release-artifacts/app-release.aab \
            release-artifacts/SHA256SUMS.txt
