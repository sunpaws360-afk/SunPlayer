name: Android Build & Release

# Verification runs on every pull request and on pushes to main.
#
# Release automation
# ------------------
# Merging a PR to main that (a) bumps versionCode/versionName in
# app/build.gradle.kts and (b) adds docs/releases/<version>.md publishes a
# release with no manual steps:
#   * detect_release spots the new version and that no v<version> tag exists;
#   * release-candidate builds the signed APK/AAB, checksums and emulator test;
#   * publish creates the v<version> tag and the GitHub Release (marked latest),
#     which the in-app updater then offers to installed users.
# The same run does the tagging on purpose: tags pushed with a workflow's own
# GITHUB_TOKEN do not trigger another workflow run.
#
# Manual releases still work: push v<versionName> yourself; the tag is validated
# against versionName before anything is built.
#
# The 'release' environment approval gate applies to both paths, so signing
# secrets are only exposed after an authorized reviewer approves.
#
# Defense-in-depth: every job defaults to read-only token access. Only the
# publish job elevates to contents:write (tag + release creation).
permissions:
  contents: read

concurrency:
  group: sunplayer-${{ github.ref }}
  # Never cancel a main/tag run: it may be in the middle of a signed release.
  # Pull request runs are cheap to supersede, so those are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags:
      - 'v*'   # manual tag push: starts the release pipeline directly
  workflow_dispatch:  # manual run: verify only (no release jobs)

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history so scans cover past commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

  # Runs for every event so release jobs can depend on it unconditionally.
  # Emits should_release=true only for a push to main whose versionName has a
  # changelog file and no matching tag yet.
  detect_release:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout repository (tags are needed to detect existing releases)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this push publishes a release
        id: detect
        shell: bash
        run: |
          version_name=$(grep -E 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version_name" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          echo "version=${version_name}" >> "$GITHUB_OUTPUT"

          should_release=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ ! -f "docs/releases/${version_name}.md" ]; then
              echo "::notice::docs/releases/${version_name}.md is missing, so ${version_name} will not be released automatically. Add the changelog file to release it."
            elif git rev-parse -q --verify "refs/tags/v${version_name}" >/dev/null; then
              echo "::notice::Tag v${version_name} already exists; nothing to release automatically."
            else
              echo "::notice::New version ${version_name} detected on main; queuing an automatic release."
              should_release=true
            fi
          fi
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  # Guards the release path so a misconfigured signing secret cannot turn main red on every
  # push. Without it, a missing or malformed SUNPLAYER_KEYSTORE_BASE64 fails release-candidate
  # on each main push until a tag exists, even though nothing is wrong with the code. This job
  # runs inside the 'release' environment so it can read the environment-scoped secrets, and
  # warns instead of failing when they are unusable.
  release-preflight:
    name: Release preflight
    needs: [detect_release]
    if: ${{ needs.detect_release.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      signing_ready: ${{ steps.check.outputs.signing_ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check that release signing is configured and usable
        id: check
        shell: bash
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          ready=true
          reason=""
          if [ -z "${SUNPLAYER_KEYSTORE_BASE64:-}" ]; then
            ready=false; reason="SUNPLAYER_KEYSTORE_BASE64 is not set"
          elif [ -z "${SUNPLAYER_KEYSTORE_PASSWORD:-}" ]; then
            ready=false; reason="SUNPLAYER_KEYSTORE_PASSWORD is not set"
          elif [ -z "${SUNPLAYER_KEY_ALIAS:-}" ]; then
            ready=false; reason="SUNPLAYER_KEY_ALIAS is not set"
          elif [ -z "${SUNPLAYER_KEY_PASSWORD:-}" ]; then
            ready=false; reason="SUNPLAYER_KEY_PASSWORD is not set"
          else
            umask 077
            if ! printf '%s' "$SUNPLAYER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/probe.keystore" 2>/dev/null; then
              ready=false; reason="SUNPLAYER_KEYSTORE_BASE64 is not valid base64"
            elif [ ! -s "$RUNNER_TEMP/probe.keystore" ]; then
              ready=false; reason="SUNPLAYER_KEYSTORE_BASE64 decoded to an empty keystore"
            fi
            rm -f "$RUNNER_TEMP/probe.keystore"
          fi
          if [ "$ready" = "true" ]; then
            echo "::notice::Release signing is configured; the release build will run."
          else
            echo "::warning::Release skipped: ${reason}. Set all four SUNPLAYER_KEYSTORE_* secrets in the 'release' environment, then push a v<versionName> tag (or bump the version) to publish."
          fi
          echo "signing_ready=${ready}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
  release-candidate:
    name: Release candidate
    outputs:
      version: ${{ steps.tag.outputs.version }}
    needs: [verify, secret-scan, detect_release, release-preflight]
    if: ${{ (needs.detect_release.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v')) && needs.release-preflight.outputs.signing_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version and validate a manual tag
        id: tag
        shell: bash
        run: |
          version_name=$(grep -E 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version_name" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected_tag="v${version_name}"
            if [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
              echo "::error::Pushed tag ${GITHUB_REF_NAME} does not match versionName ${version_name}. Expected ${expected_tag}."
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::notice::Automatic release for ${version_name}; the v${version_name} tag will be created by the publish job."
          else
            echo "::error::Release builds only run for pushed v* tags or for a main push with a new version."
            exit 1
          fi
          echo "version=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        id: signing
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          if [ -z "${SUNPLAYER_KEYSTORE_BASE64:-}" ] || \
             [ -z "${SUNPLAYER_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${SUNPLAYER_KEY_ALIAS:-}" ] || \
             [ -z "${SUNPLAYER_KEY_PASSWORD:-}" ]; then
            echo "::error::All four release-signing secrets must be configured in the release environment."
            exit 1
          fi

          umask 077
          printf '%s' "$SUNPLAYER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunplayer-release.keystore"
          if [ ! -s "$RUNNER_TEMP/sunplayer-release.keystore" ]; then
            echo "::error::SUNPLAYER_KEYSTORE_BASE64 decoded to an empty keystore."
            exit 1
          fi
          echo "keystore_path=$RUNNER_TEMP/sunplayer-release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release artifacts
        env:
          SUNPLAYER_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Remove decoded keystore from the runner immediately after signing
        if: always()
        run: rm -f "$RUNNER_TEMP/sunplayer-release.keystore"
      - name: Generate SHA-256 checksums for sideload verification
        run: |
          cd app/build/outputs
          sha256sum apk/release/app-release.apk bundle/release/app-release.aab > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release-candidate, secret-scan, detect_release, release-preflight]
    if: ${{ (needs.detect_release.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v')) && needs.release-preflight.outputs.signing_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: release-artifacts

      - name: Resolve version, tag and changelog
        id: release
        shell: bash
        env:
          VERSION: ${{ needs.release-candidate.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::release-candidate did not report a version."
            exit 1
          fi
          tag="v${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          file="docs/releases/${VERSION}.md"
          if [ ! -f "$file" ]; then
            echo "::error::Missing changelog $file - add it on main before releasing."
            exit 1
          fi
          cp "$file" release-notes.md

      - name: Create the release tag (automatic releases only)
        if: ${{ needs.detect_release.outputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::Tag ${tag} already exists; leaving it as is."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" >/dev/null
            echo "Created tag ${tag} at ${GITHUB_SHA}."
          fi

      - name: Create GitHub release with artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "SunPlayer $TAG" \
            --notes-file release-notes.md \
            --latest \
            release-artifacts/app-release.apk \
            release-artifacts/app-release.aab \
            release-artifacts/SHA256SUMS.txt
