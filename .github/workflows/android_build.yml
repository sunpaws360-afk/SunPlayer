name: Android Build & Release

concurrency:
  group: sunplayer-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Java toolchain
        run: java -version

      - name: Configure release signing
        id: configure-signing
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          missing=0
          for value in \
            "$SUNPLAYER_KEYSTORE_BASE64" \
            "$SUNPLAYER_KEYSTORE_PASSWORD" \
            "$SUNPLAYER_KEY_ALIAS" \
            "$SUNPLAYER_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              missing=1
            fi
          done

          if [[ "$GITHUB_REF" == refs/tags/v* && "$missing" == "1" ]]; then
            echo "::error::All four release-signing secrets are required for tagged releases."
            exit 1
          fi

          if [ "$missing" == "0" ]; then
            echo "$SUNPLAYER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunplayer-release.keystore"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug & Release artifacts
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.configure-signing.outputs.configured }}" == "true" ]; then
            export SUNPLAYER_KEYSTORE_PATH="$RUNNER_TEMP/sunplayer-release.keystore"
          fi
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Inspect native libraries for 16 KB readiness
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apk="app/build/outputs/apk/release/app-release.apk"
          else
            apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "Native libraries in $apk:"
          unzip -l "$apk" | grep -E '\.so$' || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Development Release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        if: steps.configure-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/
          cp app/build/outputs/bundle/release/app-release.aab release-artifacts/

      - name: Upload Release Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-bundle
          path: release-artifacts/*
          if-no-files-found: error

  instrumentation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android 16 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SunPlayer-release-bundle
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
          name: SunPlayer ${{ github.ref_name }}
          body_path: docs/releases/1.3.0.md
          fail_on_unmatched_files: true
