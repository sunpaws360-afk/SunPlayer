name: Android Build & Release

# Defense-in-depth: every job defaults to read-only token access.
# Only the publish job elevates to contents:write (needed to push a tag).
permissions:
  contents: read

concurrency:
  group: sunplayer-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.3.0.1
        required: true
        default: v1.3.0.1

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history so scans cover past commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

  release-candidate:
    name: Release candidate
    needs: [verify, secret-scan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate requested tag matches the app version
        run: |
          version_name=$(grep -E 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          requested_tag="${{ github.event.inputs.tag }}"
          expected_tag="v${version_name}"
          if [ "$requested_tag" != "$expected_tag" ]; then
            echo "::error::Requested tag $requested_tag does not match versionName $version_name. Expected $expected_tag."
            exit 1
          fi

      - name: Configure release signing
        id: signing
        env:
          SUNPLAYER_KEYSTORE_BASE64: ${{ secrets.SUNPLAYER_KEYSTORE_BASE64 }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          missing=0
          for value in \
            "$SUNPLAYER_KEYSTORE_BASE64" \
            "$SUNPLAYER_KEYSTORE_PASSWORD" \
            "$SUNPLAYER_KEY_ALIAS" \
            "$SUNPLAYER_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::All release-signing secrets must be defined in the GitHub release environment before a release candidate can be built."
            exit 1
          fi

          echo "$SUNPLAYER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunplayer-release.keystore"
          echo "keystore_path=$RUNNER_TEMP/sunplayer-release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build signed release artifacts
        env:
          SUNPLAYER_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SUNPLAYER_KEYSTORE_PASSWORD: ${{ secrets.SUNPLAYER_KEYSTORE_PASSWORD }}
          SUNPLAYER_KEY_ALIAS: ${{ secrets.SUNPLAYER_KEY_ALIAS }}
          SUNPLAYER_KEY_PASSWORD: ${{ secrets.SUNPLAYER_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Remove decoded keystore from the runner immediately after signing
        if: always()
        run: rm -f "$RUNNER_TEMP/sunplayer-release.keystore"

      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release-candidate, secret-scan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: SunPlayer-release-candidate
          path: release-artifacts

      - name: Create and push release tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
          name: SunPlayer ${{ github.event.inputs.tag }}
          body_path: docs/releases/1.3.0.1.md
          fail_on_unmatched_files: true
