# gitleaks configuration for SunPlayer
# Catches GitHub tokens (classic + fine-grained), private keys, keystore
# credentials, and Slack/AWS-style secrets in diffs, files, and git history.
#
# IMPORTANT: gitleaks compiles every rule and allowlist regex with RE2. RE2 has
# no lookahead, no lookbehind and no backreferences. A single unsupported
# construct makes the scanner panic while translating this config, which then
# fails the Secret scan job with "results.sarif does not exist" - it never scans
# anything. Keep patterns to character classes, alternation, anchors and
# (lazy) quantifiers only.
title = "SunPlayer gitleaks config"

[extend]
# Starts from gitleaks' built-in ruleset (detects ghp_, github_pat_, etc.)
useDefault = true

# Match allowlist regexes against the whole line, not just the matched secret.
# This lets documentation prose that merely *mentions* keystore/password words
# be allowlisted on paths the generic rules would otherwise flag.
regexTarget = "line"

[[rules]]
id = "generic-secret-assignment"
description = "Hardcoded password/secret assignments"
regex = '''(?i)(storePassword|keyPassword|trustPassword|api[_-]?key|secret)\s*[:=]\s*["'][^"'${{]{8,}["']'''
tags = ["password", "secret"]

[[rules]]
id = "android-keystore-reference"
description = "Keystore path on the same line as an assigned password/alias value"
# Previously this matched any line containing both ".jks" and "password", which
# caught ordinary documentation. It now requires a real assignment: ":" or "="
# followed by a non-placeholder value of 6+ characters.
regex = '''(?i)(\.jks|\.keystore)\b[^\n]{0,120}?(password|passwd|storepass|keypass|keyalias)\s*[:=]\s*["']?[^\s"'$]{6,}'''
tags = ["keystore"]
[rules.allowlist]
paths = ['''docs/.*\.md$''', '''README\.md$''']

[allowlist]
description = "Allow non-secret placeholders and docs"
paths = [
    '''gitleaks-report\.json''',
    # Root-level project documentation that legitimately *mentions* keystore
    # and password words while describing the release process (no values).
    '''^(HANDOVER|AUDIT|RELEASE-CHECKLIST|DISTRIBUTION)\.md$''',
    '''^docs/(RELEASE-CHECKLIST|DISTRIBUTION|BUILDING|MASTER_PROMPT)\.md$''',
]
# Commits made before the repo-standard .gitleaks.toml existed are scanned with
# gitleaks' default ruleset only, so a global (rule-independent) allowlist is
# required to suppress historical documentation false positives.
commits = [
    # docs/STATUS.md line 5 prose ("...compatibility, CI/instrumentation verification...")
    # matched the built-in generic-api-key rule via the substring "CI/in". Not a secret;
    # the file was rewritten later and contains no credential today.
    '''5ef4d0fdd558c6b120449ba078d3618b55188a31''',
]
regexes = [
    # Environment-variable indirection used by app/build.gradle.kts and CI
    '''providers\.environmentVariable\("SUNPLAYER_[A-Z_]+"\)''',
    '''\$\{\{\s*secrets\.SUNPLAYER_[A-Z_]+\s*\}\}''',
    # Placeholder values in documentation
    '''your-(password|alias|keystore)''',
]
